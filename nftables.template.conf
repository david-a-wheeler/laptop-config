#!/usr/sbin/nft -f
# Rendered from nftables.template.conf by vm-setup.sh - edit the template,
# not /etc/nftables.conf, since a re-run of vm-setup.sh overwrites it.
#
# Egress control: allow loopback (so local security testing against
# loopback works without exposing external networks), DNS, and the ports
# listed in config.sh's NFTABLES_ALLOWED_TCP_PORTS. Reject everything else
# outbound. Inbound/forward are left at their distro defaults.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        # Allow replies to any connection someone else already established
        # or that's related to one (e.g. an ICMP error for it) - without
        # this, ANY reply to an inbound-initiated connection gets silently
        # dropped, since the reply is itself an outbound packet with an
        # arbitrary ephemeral destination port that never matches the
        # per-port rules below. This was a real bug: a ping reply and an
        # SSH server's SYN-ACK back to the host both got eaten by this
        # ruleset, making host->VM ssh hang with no response at all rather
        # than a clean refusal.
        ct state established,related accept

        # Allow loopback traffic for local testing and the SSH reverse tunnel
        oif "lo" accept

        # Allow outbound DNS
        udp dport 53 accept
        tcp dport 53 accept

        # Allow outbound ports from config.sh's NFTABLES_ALLOWED_TCP_PORTS
        tcp dport { @@NFTABLES_ALLOWED_TCP_PORTS_NFT@@ } accept

        # The host secrets server only ever has one legitimate destination
        # (the host itself) - scoped to that address specifically, rather
        # than folded into the port set above, which would let the VM reach
        # ANY host on this port instead of just the one that matters.
        ip daddr @@HOST_GATEWAY_IP@@ tcp dport @@SECRETS_SERVER_PORT@@ accept

        # Reject all other outbound traffic
        reject
    }
}
